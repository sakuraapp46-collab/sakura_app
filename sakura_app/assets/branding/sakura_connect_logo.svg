<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Sakura Connect logo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFF7FA"/>
      <stop offset="100%" stop-color="#FFE8F2"/>
    </linearGradient>
    <linearGradient id="petal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF9EC4"/>
      <stop offset="100%" stop-color="#E85691"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#C64274" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect width="1024" height="1024" rx="220" fill="url(#bg)"/>

  <g transform="translate(512 440)" filter="url(#softShadow)">
    <ellipse cx="0" cy="-132" rx="84" ry="138" fill="url(#petal)"/>
    <ellipse cx="126" cy="-41" rx="84" ry="138" transform="rotate(72 126 -41)" fill="url(#petal)"/>
    <ellipse cx="78" cy="111" rx="84" ry="138" transform="rotate(144 78 111)" fill="url(#petal)"/>
    <ellipse cx="-78" cy="111" rx="84" ry="138" transform="rotate(-144 -78 111)" fill="url(#petal)"/>
    <ellipse cx="-126" cy="-41" rx="84" ry="138" transform="rotate(-72 -126 -41)" fill="url(#petal)"/>
    <circle cx="0" cy="0" r="44" fill="#FFD56A"/>
    <circle cx="-14" cy="-10" r="5" fill="#E0A52A"/>
    <circle cx="12" cy="-6" r="5" fill="#E0A52A"/>
    <circle cx="0" cy="12" r="5" fill="#E0A52A"/>
  </g>

  <g transform="translate(512 780)">
    <text x="0" y="0" text-anchor="middle" font-family="Poppins, Montserrat, Arial, sans-serif" font-size="86" font-weight="700" fill="#B03064" letter-spacing="1.2">
      Sakura
    </text>
    <text x="0" y="78" text-anchor="middle" font-family="Poppins, Montserrat, Arial, sans-serif" font-size="52" font-weight="600" fill="#D45186" letter-spacing="8">
      CONNECT
    </text>
  </g>
</svg>
